name: Notifications scan

on:
  push:
    branches: [main]
    paths:
      - 'components/*/src/**'
      - 'components/*/Dockerfile'
      - '.trivyignore.yaml'
      - '.github/workflows/container-scan.yml'
      - 'Directory.Packages.props'
  pull_request:
    branches: [main]
    paths:
      - 'components/*/src/**'
      - 'components/*/Dockerfile'
      - '.trivyignore.yaml'
      - '.github/workflows/container-scan.yml'
      - 'Directory.Packages.props'
  schedule:
    - cron: '0 8 * * 1,4'

concurrency:
  group: container-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      sms: ${{ steps.filter.outputs.sms }}
      email: ${{ steps.filter.outputs.email }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'components/api/src/**'
              - 'components/api/Dockerfile'
              - 'components/shared/src/**'
              - '.trivyignore.yaml'
              - '.github/workflows/container-scan.yml'
              - 'Directory.Packages.props'
            sms:
              - 'components/shared/src/**'
              - 'components/sms-service/src/**'
              - 'components/sms-service/Dockerfile'
              - '.trivyignore.yaml'
              - '.github/workflows/container-scan.yml'
              - 'Directory.Packages.props'
            email:
              - 'components/shared/src/**'
              - 'components/email-service/src/**'
              - 'components/email-service/Dockerfile'
              - '.trivyignore.yaml'
              - '.github/workflows/container-scan.yml'
              - 'Directory.Packages.props'

  scan-api:
    name: 'Scan: Notifications API'
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.api == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-scan-component.yml
    with:
      component-name: 'Notifications API'
      image-name: altinn-notifications-api
      dockerfile: components/api/Dockerfile

  scan-email:
    name: 'Scan: Email Delivery Service'
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.email == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-scan-component.yml
    with:
      component-name: 'Email Delivery Service'
      image-name: altinn-notifications-email
      dockerfile: components/email-service/Dockerfile

  scan-sms:
    name: 'Scan: SMS Delivery Service'
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.sms == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-scan-component.yml
    with:
      component-name: 'SMS Delivery Service'
      image-name: altinn-notifications-sms
      dockerfile: components/sms-service/Dockerfile

  slack-notify:
    name: Notify Slack on findings
    needs: [scan-api, scan-email, scan-sms]
    # Each scan-* job exits with a failure result when it finds CRITICAL/HIGH
    # vulnerabilities (see container-scan-component.yml), so this must not be
    # gated on those jobs succeeding. A job that was skipped (its component's
    # paths didn't change on a push/PR run) must not trigger an alert; an
    # empty count from a job that *did* run means it broke before counting -
    # also worth an alert.
    if: >
      github.event_name != 'pull_request' && !cancelled() && (
        (needs.scan-api.result != 'skipped' && needs.scan-api.outputs.findings-count != '0') ||
        (needs.scan-email.result != 'skipped' && needs.scan-email.outputs.findings-count != '0') ||
        (needs.scan-sms.result != 'skipped' && needs.scan-sms.outputs.findings-count != '0')
      )
    uses: ./.github/workflows/send-slack-warning.yml
    permissions: {}
    with:
      warning-message: 'Notifications scan failed or found potential vulnerabilities in one or more components - inspect workflow log for more details'
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_CORE_ALERTS }}
