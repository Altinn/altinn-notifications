# The nested agent with its image built from this checkout, to try a change to the Dockerfile or what it copies before
# CI publishes it. The host that applies it needs Docker or Podman.
apiVersion: agents.platform/v1alpha1
kind: AgentVariant
extends: agent.nested.yaml

metadata:
  name: notifications-backend-dev-nested

spec:
  sandbox:
    image:
      type: build
      context: ..
      dockerfile: Dockerfile
      target: minimal
